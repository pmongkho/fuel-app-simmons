<section class="space-y-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <h2 class="text-2xl font-semibold">New Fuel Report <span class="text-slate-500">- {{ reportDate }}</span></h2>

    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <label class="sm:col-span-2">
        <span class="mb-1 block text-sm font-medium text-slate-600">Report date</span>
        <input [(ngModel)]="reportDate" type="date" class="w-full rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
      </label>
      <label class="sm:col-span-2">
        <span class="mb-1 block text-sm font-medium text-slate-600">Expectations</span>
        <textarea [(ngModel)]="expectations" class="min-h-20 w-full rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring"></textarea>
      </label>
      <label>
        <span class="mb-1 block text-sm font-medium text-slate-600">Trailers on yard/Main/Flex yards</span>
        <textarea [(ngModel)]="trailersOnYard" class="min-h-20 w-full rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring"></textarea>
      </label>
      <label>
        <span class="mb-1 block text-sm font-medium text-slate-600">Trailer Mechanical issues</span>
        <textarea [(ngModel)]="mechanicalIssues" class="min-h-20 w-full rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring"></textarea>
      </label>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <h3 class="text-xl font-semibold">Add Row</h3>
    <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <input [(ngModel)]="entry.trailerNumber" placeholder="Trailer/Truck Number" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
      <select [(ngModel)]="entry.fuelType" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring">
        <option>RedDiesel</option><option>ClearDiesel</option><option>Def</option>
      </select>
      <input [(ngModel)]="entry.startGaugeLevel" placeholder="Tank Start" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
      <input [(ngModel)]="entry.endGaugeLevel" placeholder="Tank End" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
      <input [(ngModel)]="entry.gallonsPumped" type="number" placeholder="Gallons pumped" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
      <input [(ngModel)]="entry.notes" placeholder="Notes" class="rounded-lg border border-slate-300 px-3 py-2 ring-sky-300 outline-none focus:ring" />
    </div>

    <button (click)="saveEntry()" class="mt-4 rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white hover:bg-sky-700">+ Add Row</button>

    <div class="mt-4 overflow-x-auto">
      <table class="min-w-full text-left text-sm">
        <thead class="border-y border-slate-200 bg-slate-50 text-slate-600">
          <tr><th class="px-2 py-2 font-medium">Trailer #</th><th class="px-2 py-2 font-medium">Fuel type</th><th class="px-2 py-2 font-medium">Start</th><th class="px-2 py-2 font-medium">End</th><th class="px-2 py-2 font-medium">Gallons</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of entries()" class="border-b border-slate-100">
            <td class="px-2 py-2">{{ e.trailerNumber }}</td><td class="px-2 py-2">{{ e.fuelType }}</td><td class="px-2 py-2">{{ e.startGaugeLevel }}</td><td class="px-2 py-2">{{ e.endGaugeLevel }}</td><td class="px-2 py-2">{{ e.gallonsPumped }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 grid gap-2 text-sm sm:grid-cols-2 lg:grid-cols-4">
      <p class="rounded-lg bg-slate-50 p-3">Red Diesel: <strong>{{ redTotal() }}</strong></p>
      <p class="rounded-lg bg-slate-50 p-3">Clear Diesel: <strong>{{ clearTotal() }}</strong></p>
      <p class="rounded-lg bg-slate-50 p-3">DEF: <strong>{{ defTotal() }}</strong></p>
      <p class="rounded-lg bg-slate-50 p-3">Overall: <strong>{{ overallTotal() }}</strong></p>
    </div>

    <button class="mt-4 w-full rounded-lg bg-sky-600 px-4 py-2.5 font-semibold text-white hover:bg-sky-700 sm:w-auto">Submit Report</button>
  </div>
</section>
